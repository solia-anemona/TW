<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Comunitatea TW</title>
    <link rel="stylesheet" href="../CSS/register_style.css">
    <link rel="stylesheet" href="../CSS/cursor.css">
</head>
<body>
    <div class="register-container">
        <h2>Înregistrare</h2>
        <form id="register-form">
            <input type="text" id="reg-username" placeholder="Utilizator" required>
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-password" placeholder="Parolă" required>
            <button type="submit">Înregistrează-te</button>
        </form>
        <p>Ai deja cont? <a href="login.html">Conectează-te</a></p>
    </div>

    <script src="../JS/cursor.js"></script>
</body>
</html>
