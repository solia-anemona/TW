{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Foto - Comunitatea TW</title>
    <link rel="stylesheet" href="{% static 'galerie.css' %}">
    <link rel="stylesheet" href="{% static 'cursor.css' %}">
</head>
<body>
    <header>
        <div class="container nav-container">
            <h1>Comunitatea TW 2025</h1>
            <nav>
                <a href="{% url 'home' %}">Acasă</a>
                <a href="{% url 'galerie' %}" class="active">Galerie</a>
                <a href="{% url 'universities' %}">Facultăți</a>
                <a href="{% url 'chatbot' %}">ChatBot</a>
                <a href="{% url 'login' %}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="gallery-wrapper">
        <div class="carousel-card">
            <h2>Galerie Foto Interactivă</h2>
            <div class="carousel-view">
                <img id="carousel-image" src="{% static 'logo.png' %}" alt="Galerie Foto">
            </div>
            <div class="controls">
                <button id="prev-btn" class="btn">❮ Înapoi</button>
                <button id="next-btn" class="btn">Înainte ❯</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Comunitatea de Tehnologii Web</p>
        </div>
    </footer>

    <script src="{% static 'cursor.js' %}"></script>
    <script src="{% static 'galerie.js' %}"></script>
</body>
</html>
