{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - Comunitatea TW</title>
    <link rel="stylesheet" href="{% static 'chatbot_style.css' %}">
    <link rel="stylesheet" href="{% static 'cursor.css' %}">
</head>
<body>
    <header>
        <div class="container nav-container">
            <h1>Comunitatea TW 2025</h1>
            <nav>
                <a href="{% url 'home' %}">Acasă</a>
                <a href="{% url 'galerie' %}">Galerie</a>
                <a href="{% url 'universities' %}">Facultăți</a>
                <a href="{% url 'chatbot' %}" class="active">ChatBot</a>
                <a href="{% url 'login' %}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="chat-wrapper">
        <div class="chat-card">
            <h2>Asistent Virtual TW</h2>
            <div id="chat-box" class="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Scrie un mesaj aici...">
                <button id="send-btn" class="btn">Trimite</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Comunitatea de Tehnologii Web</p>
        </div>
    </footer>

    <script src="{% static 'chatbot_js.js' %}"></script>
    <script src="{% static 'cursor.js' %}"></script>
</body>
</html>
